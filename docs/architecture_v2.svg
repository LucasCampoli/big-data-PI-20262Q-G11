<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 940" width="100%" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="Cloud Provider Analytics, arquitectura v2">
  <title>Cloud Provider Analytics, arquitectura v2, lo implementado en la entrega 2, 2026-11-04</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
    <style>
      .zone { fill: #eef4fb; stroke: #4a6fa5; stroke-width: 1.2; }
      .job { fill: #fdf6e3; stroke: #b58900; stroke-width: 1.2; }
      .plain { fill: #ffffff; stroke: #7a7a7a; stroke-width: 1.2; }
      .band { fill: #f6f6f2; stroke: #9a9a8c; stroke-width: 1.2; }
      .group { fill: none; stroke: #b58900; stroke-width: 1; stroke-dasharray: 5 4; }
      .flow { stroke: #4a4a4a; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .dq { stroke: #8a4a4a; stroke-width: 1.3; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .h { font-weight: bold; font-size: 14px; fill: #17293f; }
      .t { fill: #2e2e26; }
      .lbl { font-size: 12px; fill: #333333; }
      .lbldq { font-size: 12px; fill: #8a4a4a; }
      .title { font-size: 15px; font-weight: bold; fill: #17293f; }
    </style>
  </defs>
  <rect x="0" y="0" width="1000" height="940" fill="#ffffff"/>
  <text class="title" x="500" y="28" text-anchor="middle">Cloud Provider Analytics · arquitectura v2 · lo implementado en la entrega 2 · 2026-11-04</text>

  <!-- Sources and Landing -->
  <rect class="plain" x="60" y="50" width="600" height="50" rx="6"/>
  <text x="360" y="70" text-anchor="middle"><tspan class="h">Fuentes</tspan></text>
  <text class="t" x="360" y="89" text-anchor="middle">6 maestros CSV + facturación · usage_events_stream, 120 partes JSONL</text>

  <rect class="zone" x="60" y="130" width="600" height="50" rx="6"/>
  <text x="360" y="150" text-anchor="middle"><tspan class="h">Landing · data/landing</tspan></text>
  <text class="t" x="360" y="169" text-anchor="middle">inmutable, como la recibimos; nada la escribe</text>

  <!-- Ingestion jobs -->
  <rect class="group" x="45" y="208" width="630" height="128" rx="8"/>
  <text class="lbl" x="58" y="224">Ingesta · PySpark 4.2</text>
  <rect class="job" x="60" y="232" width="280" height="92" rx="6"/>
  <text x="200" y="252" text-anchor="middle"><tspan class="h">Carga batch</tspan></text>
  <text class="t" x="200" y="272" text-anchor="middle">esquema explícito y chequeo</text>
  <text class="t" x="200" y="289" text-anchor="middle">del encabezado CSV</text>
  <text class="t" x="200" y="306" text-anchor="middle">registro de ingestados con sha256</text>

  <rect class="job" x="360" y="232" width="300" height="92" rx="6"/>
  <text x="510" y="252" text-anchor="middle"><tspan class="h">Structured Streaming</tspan></text>
  <text class="t" x="510" y="272" text-anchor="middle">availableNow, 10 archivos por micro-batch</text>
  <text class="t" x="510" y="289" text-anchor="middle">watermark de 1 h sobre ingest_ts</text>
  <text class="t" x="510" y="306" text-anchor="middle">dedupe por event_id · 2 checkpoints</text>

  <!-- Zones -->
  <rect class="zone" x="60" y="372" width="600" height="56" rx="6"/>
  <text x="360" y="393" text-anchor="middle"><tspan class="h">Bronze · Parquet con Snappy</tspan></text>
  <text class="t" x="360" y="413" text-anchor="middle">eventos por ingest_date · billing por month · maestros sin particionar</text>

  <rect class="zone" x="60" y="470" width="600" height="74" rx="6"/>
  <text x="360" y="491" text-anchor="middle"><tspan class="h">Silver · reconstrucción batch completa</tspan></text>
  <text class="t" x="360" y="511" text-anchor="middle">eventos por event_date y 7 maestros conformados</text>
  <text class="t" x="360" y="529" text-anchor="middle">reglas D6 y D7 · joins broadcast con customers_orgs y resources · dedupe exacto</text>

  <rect class="zone" x="60" y="586" width="600" height="74" rx="6"/>
  <text x="360" y="607" text-anchor="middle"><tspan class="h">Gold · por usage_date</tspan></text>
  <text class="t" x="360" y="627" text-anchor="middle">org_daily_usage_by_service, conciliado contra Silver a 0,01 USD</text>
  <text class="t" x="360" y="645" text-anchor="middle">cost_anomaly_mart, z-score modificado con MAD sobre 28 días</text>

  <rect class="plain" x="60" y="702" width="600" height="74" rx="6"/>
  <text x="360" y="723" text-anchor="middle"><tspan class="h">Cassandra 5.0 en Docker</tspan></text>
  <text class="t" x="360" y="743" text-anchor="middle">keyspace cloud_analytics · 2 tablas query-first</text>
  <text class="t" x="360" y="761" text-anchor="middle">partition key org_id, clustering usage_date DESC, service</text>

  <rect class="plain" x="700" y="702" width="260" height="74" rx="6"/>
  <text x="830" y="723" text-anchor="middle"><tspan class="h">AstraDB</tspan></text>
  <text class="t" x="830" y="743" text-anchor="middle">mismo cargador, por configuración</text>
  <text class="t" x="830" y="761" text-anchor="middle">keyspace cpa · mismas 2 tablas</text>

  <rect class="plain" x="60" y="810" width="600" height="50" rx="6"/>
  <text x="360" y="830" text-anchor="middle"><tspan class="h">Consumo</tspan></text>
  <text class="t" x="360" y="849" text-anchor="middle">Q1 y Q2 de FinOps · Q6 días anómalos · cqlsh y driver de Python</text>

  <rect class="zone" x="740" y="470" width="220" height="74" rx="6"/>
  <text x="850" y="491" text-anchor="middle"><tspan class="h">Quarantine</tspan></text>
  <text class="t" x="850" y="511" text-anchor="middle">4 tablas, una por escritor</text>
  <text class="t" x="850" y="529" text-anchor="middle">por quarantine_date</text>

  <rect class="band" x="45" y="884" width="915" height="44" rx="6"/>
  <text class="t" x="502" y="902" text-anchor="middle"><tspan font-weight="bold">Transversales:</tspan> compuertas de calidad y conciliación · log y resumen JSON por run_id</text>
  <text class="t" x="502" y="919" text-anchor="middle">linaje por columnas técnicas · email con hash en Silver · credenciales fuera de git</text>

  <!-- Main flow -->
  <path class="flow" d="M360,100 L360,128"/>
  <path class="flow" d="M290,180 L230,230"/>
  <path class="flow" d="M430,180 L490,230"/>
  <path class="flow" d="M200,324 L290,370"/>
  <text class="lbl" x="214" y="352">append</text>
  <path class="flow" d="M510,324 L430,370"/>
  <text class="lbl" x="476" y="352">append</text>
  <path class="flow" d="M360,428 L360,468"/>
  <text class="lbl" x="370" y="453">batch, D+1</text>
  <path class="flow" d="M360,544 L360,584"/>
  <text class="lbl" x="370" y="569">groupBy y conciliación</text>
  <path class="flow" d="M360,660 L360,700"/>
  <text class="lbl" x="370" y="685">foreachPartition con el driver, upsert por clave</text>
  <path class="flow" d="M360,776 L360,808"/>
  <path class="flow" d="M660,640 L830,640 L830,700"/>
  <text class="lbl" x="672" y="632">segundo destino, upsert</text>
  <path class="flow" d="M830,776 L830,835 L662,835"/>

  <!-- Quality path -->
  <path class="dq" d="M675,280 L800,280 L800,468"/>
  <text class="lbldq" x="686" y="272">fallas de parseo</text>
  <path class="dq" d="M660,507 L738,507"/>
  <text class="lbldq" x="664" y="498">reglas</text>
  <path class="dq" d="M900,470 L900,155 L662,155"/>
  <text class="lbldq" x="680" y="146">arreglar y reprocesar desde Landing</text>
</svg>
