# Local Cassandra for the serving layer. Run from the repo root: make cassandra-up
name: cloud-provider-analytics

services:
  cassandra:
    image: cassandra:5.0
    container_name: cpa-cassandra
    # Password authentication and role permissions instead of the image's allow-all (D19). The
    # stock superuser is cassandra/cassandra until make cassandra-init replaces its password.
    entrypoint:
      - bash
      - -c
      - >-
        sed -i -E
        -e 's/AllowAllAuthenticator/PasswordAuthenticator/'
        -e 's/AllowAllAuthorizer/CassandraAuthorizer/'
        /etc/cassandra/cassandra.yaml
        && exec docker-entrypoint.sh cassandra -f
    ports:
      - "9042:9042"
    environment:
      # One node on a laptop: a small heap is enough for a few thousand rows.
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
      CASSANDRA_CLUSTER_NAME: cpa-local
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ../cql:/cql:ro
    healthcheck:
      # nodetool needs no CQL login: healthy once the node accepts client connections.
      test: ["CMD-SHELL", "nodetool statusbinary | grep -q running"]
      interval: 20s
      timeout: 40s
      retries: 20
      start_period: 60s

volumes:
  cassandra-data:
